# Dependency-Check settings of SecureScan (not a scan profile: it has `tool:` instead of `profile:`).
# Read by backend/securescan/runner/tools/dependency_check.py. A scan profile can override
# `no_disclosure` for one job with `options: {no_disclosure: true|false}`.
tool: dependency-check

# Analyzers. Sonatype OSS Index and the npm, Yarn and pnpm audit lookups stay off in every case (they send
# component data to third parties; the catalogue command passes the matching --disable flags).
# `central` is the lookup of file hashes at Maven Central (search.maven.org, through the egress proxy). It improves
# the identification of JARs and is turned off by the "no third-party disclosure" mode.
analyzers:
  central: true
  ossindex: false
  npm_audit: false

# Applications of these types default to no_disclosure: true (design: "Operating rules for the scanners").
no_disclosure_for_application_types: [vendor]

# Paths that Dependency-Check skips (--exclude, Ant-style patterns). Keep the list short: every pattern is a
# place where nothing is scanned.
exclude: []
