# The SonarQube scanner (plan M8 task 5). It runs on the internal `sonarqube` network and reaches only the
# server container. SONAR_TOKEN (a project analysis token minted per job, expiring after one day) is added to
# the environment by the builder: it is the single credential this container receives.
# The issues export is produced after the container exits (post-run, from the SonarQube API), so its output
# file is optional here; the builder stores it itself.
schema_version: 1
scanners:
  - tool: sonarqube
    description: SonarQube Community Build analysis, quality gate, measures and the issues export
    image: {name: sonarsource/sonar-scanner-cli, tag: 12.2.0.4256_8.1.0, lock: SONAR_SCANNER}
    user: "1000:1000"
    network: sonarqube
    entrypoint: null            # S3 ran "<image> sonar-scanner ..." with the image's own entrypoint
    mounts:
      - {name: src, target: /usr/src, read_only: true}
      - {name: out, target: /out, read_only: false}
    tmpfs:
      - {path: /tmp, size: 512m}  # the builder adds the exec option (S3 tries noexec first and falls back)
    limits: {cpus: 2, memory: 3g, pids: 512}
    timeout_minutes: 60
    max_parallel: 1
    env:
      HOME: /tmp
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_USER_HOME: /tmp/.sonar
    command:
      - sonar-scanner
      - "-Dsonar.projectKey={project_key}"
      - "-Dsonar.sources=."
      - "-Dsonar.scm.disabled=true"
      - "-Dsonar.working.directory={out}/.scannerwork"
    outputs:
      - {file: sonarqube-issues.zip, max_mb: 200, format: none, required: false}
    exit_codes:
      "0": completed
      default: failed
    target_kinds: [github_repo, vendor_repo, zip, image]
    defectdojo_scan_type: SonarQube Scan
    defectdojo_file: sonarqube-issues.zip
