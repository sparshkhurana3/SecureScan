# The SonarQube server is NOT a Compose service. The worker creates this container from the entry the first
# time a SonarQube job needs it (jobs/sonarqube_lifecycle.py::ensure_running), starts it when stopped, and
# stops it after 15 idle minutes. Networks (sonarqube + backend), the three named volumes, the ulimits, the
# database settings and the 300 s stop grace period are added by the lifecycle code from SECURESCAN_SONARQUBE_*
# settings; the image, user, limits, tmpfs, environment and command come from here.
# Unverified until S3 runs: the command (read the image's own with `docker image inspect <image> --format
# "{{.Config.Entrypoint}} {{.Config.Cmd}}"` and copy the Cmd here) and a read-only root filesystem with exec
# tmpfs directories (SECURESCAN_SONARQUBE_READ_ONLY_ROOTFS=false switches the read-only root filesystem off).
schema_version: 1
scanners:
  - tool: sonarqube-server
    description: SonarQube Community Build server (started on demand, stopped after 15 idle minutes)
    image: {name: sonarqube, tag: 26.9.0.129388-community, lock: SONARQUBE}
    user: "1000:0"
    network: sonarqube
    entrypoint: null            # keep the image's /opt/sonarqube/docker/entrypoint.sh
    mounts: []
    tmpfs:
      - {path: /opt/sonarqube/temp, size: 2g}   # the lifecycle adds exec (Elasticsearch loads native libraries from here)
      - {path: /tmp, size: 256m}
    limits: {cpus: 4, memory: 4g, pids: 2048}
    timeout_minutes: 10         # start timeout; SECURESCAN_SONARQUBE_START_TIMEOUT_SECONDS overrides it
    max_parallel: 1
    env:
      SONAR_TELEMETRY_ENABLE: "false"
    command: ["/opt/sonarqube/docker/sonar.sh"]
    exit_codes:
      "0": completed
      default: failed
    target_kinds: []
