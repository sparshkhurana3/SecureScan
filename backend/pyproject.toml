[project]
name = "securescan"
version = "0.1.0"
description = "SecureScan: on-premises SAST and DAST scanning platform"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.1",
  "alembic>=1.20",
  "pydantic>=2.13",
  "pydantic-settings>=2.7",
  "psycopg[binary,pool]>=3.3",
  "procrastinate>=3.10",
  "httpx>=0.28",
  "authlib>=1.4",
  "pyjwt[crypto]>=2.10",
  "cryptography>=44",
  "docker>=7.1",
  "jinja2>=3.1",
  "weasyprint>=70",
  "pypdf>=5",
  "python-multipart>=0.0.20",
  "structlog>=25",
  "prometheus-client>=0.21",
  "pyyaml>=6",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["securescan"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["authlib.*", "weasyprint.*", "procrastinate.*", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs the docker compose test profile (SECURESCAN_INTEGRATION=1)",
]
