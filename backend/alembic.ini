# Developer entry point for `alembic check` and `alembic revision`. The application itself builds its
# Alembic configuration in code (securescan/db/migrate.py), so this file is not shipped in the image.
# The database URL comes from SECURESCAN_DATABASE_URL (+ SECURESCAN_DATABASE_PASSWORD); see env.py.
[alembic]
script_location = %(here)s/securescan/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
