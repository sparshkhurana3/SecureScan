# Every image SecureScan runs, pinned by tag AND digest.
# `python scripts/dev.py pin-images` resolves the digests and writes deploy/images.env.
# Tags below were observed on 5-6 October 2026; pin-images fails loudly if one no longer exists.
# `digest: null` means "not pinned yet" - run pin-images before the first `up`.
images:
  - { name: POSTGRES, image: postgres, tag: "18.6", digest: null }
  - { name: PYTHON, image: python, tag: 3.14-slim-trixie, digest: null }
  - { name: NODE, image: node, tag: "24", digest: null }
