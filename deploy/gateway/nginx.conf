worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_max_body_size 64m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's embedded DNS; upstreams are resolved per request so start order does not matter.
  resolver 127.0.0.11 valid=10s ipv6=off;

  limit_req_zone $cookie_securescan_session zone=session:10m rate=20r/s;

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  ssl_certificate     /run/secrets/tls_cert;
  ssl_certificate_key /run/secrets/tls_key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Portal host.
  server {
    listen 8443 ssl default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;

    # Health and metrics endpoints are deliberately not proxied.
    location ~ ^/(healthz|readyz|metrics)$ { return 404; }

    # Server-sent events for scan progress: no buffering.
    location ~ ^/api/v1/scans/[^/]+/events$ {
      set $api http://api:8000;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=session burst=40 nodelay;
      set $api http://api:8000;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location / { try_files $uri /index.html; }
  }

  # DefectDojo host. Enabled in M4: auth_request against /api/v1/auth/check, then DefectDojo's nginx.
  server {
    listen 8443 ssl;
    server_name ~^dojo\.;
    location / { return 503 "DefectDojo is not enabled yet\n"; }
  }
}
