worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_max_body_size 64m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's embedded DNS; upstreams are resolved per request so start order does not matter.
  resolver 127.0.0.11 valid=10s ipv6=off;

  limit_req_zone $cookie_securescan_session zone=session:10m rate=20r/s;

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  ssl_certificate     /run/secrets/tls_cert;
  ssl_certificate_key /run/secrets/tls_key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Portal host.
  server {
    listen 8443 ssl default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;

    # Health and metrics endpoints are deliberately not proxied.
    location ~ ^/(healthz|readyz|metrics)$ { return 404; }

    # Server-sent events for scan progress: no buffering.
    location ~ ^/api/v1/scans/[^/]+/events$ {
      set $api http://api:8000;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=session burst=40 nodelay;
      set $api http://api:8000;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location / { try_files $uri /index.html; }
  }

  # Portal host for the redirect of the DefectDojo host: "dojo.securescan.example:8443" -> "securescan.example:8443".
  map $http_host $portal_host {
    "~^dojo\.(?<portal>.+)$" $portal;
    default $http_host;
  }

  # Remove SecureScan's own session cookie from requests that go on to DefectDojo (it is only for the
  # gateway and the api). If the pattern does not match, the Cookie header is passed unchanged.
  map $http_cookie $dojo_cookie {
    "~*^(?<before>.*?)(?:^|;\s*)securescan_session=[^;]*(?<after>.*)$" "$before$after";
    default $http_cookie;
  }

  # DefectDojo host: reachable only with a valid SecureScan session (auth_request against the api),
  # then proxied to DefectDojo's nginx service. The upstream name is resolved per request through
  # Docker's DNS (variable in proxy_pass), so the gateway starts even when DefectDojo is not running.
  server {
    listen 8443 ssl;
    server_name ~^dojo\.;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 100m;

    # Internal subrequest: 204 = signed in, 401 = not. Always a GET, whatever the original method.
    location = /_securescan_auth {
      internal;
      set $api http://api:8000;
      proxy_pass $api/api/v1/auth/check;
      proxy_method GET;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location @portal_login {
      return 302 https://$portal_host/login;
    }

    location @dojo_unavailable {
      default_type text/plain;
      return 503 "DefectDojo is not available right now.
";
    }

    location / {
      limit_req zone=session burst=40 nodelay;
      auth_request /_securescan_auth;
      error_page 401 = @portal_login;
      error_page 502 503 504 = @dojo_unavailable;

      set $dojo http://nginx:8080;
      proxy_pass $dojo;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Cookie $dojo_cookie;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
    }
  }
}
